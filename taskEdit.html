<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('タスク編集')}"></head>

<body>
	<div class="app">
		<nav th:replace="~{fragments :: sidebar('list')}"></nav>

		<main class="main">
			<div class="eyebrow">// EDIT TASK</div>
			<h1>タスクの編集</h1>

			<div class="cy-card" style="max-width: 640px; margin-top: 24px;">
				<div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

				<form th:action="@{/task/{id}/edit(id=${task.id})}" method="post" th:object="${task}">
					<input type="hidden" name="_csrf" th:value="${csrfToken}">
					<div class="form-group">
						<label>ID</label>
						<input type="text" class="form-control" th:value="${task.id}" disabled>
					</div>
					<div class="form-group">
						<label for="title">タスク名</label>
						<input type="text" class="form-control" id="title" th:field="*{title}" maxlength="100">
					</div>
					<div class="form-group">
						<label for="dueDate">期限</label>
						<input type="date" class="form-control" id="dueDate" th:field="*{dueDate}">
					</div>
					<div class="form-group">
						<label for="description">詳細</label>
						<textarea class="form-control" id="description" th:field="*{description}" maxlength="500"
							rows="4"></textarea>
					</div>
					<div class="form-group form-check">
						<input type="checkbox" class="form-check-input" id="completedCheck"
							th:checked="${task.isDone()}"
							onclick="document.getElementById('completedHidden').value = this.checked ? 1 : 0;">
						<label class="form-check-label" for="completedCheck">完了済みにする</label>
						<input type="hidden" id="completedHidden" name="completed" th:value="${task.completed}">
					</div>
					<button type="submit" class="btn btn-primary">更新</button>
					<a th:href="@{/index}" class="btn btn-secondary">キャンセル</a>
				</form>
			</div>
		</main>
	</div>

	<script th:src="@{/js/jquery-4.0.0.slim.min.js}"></script>
	<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>

</html>
