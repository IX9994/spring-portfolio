<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('タスク追加')}"></head>

<body>
	<div class="app">
		<nav th:replace="~{fragments :: sidebar('add')}"></nav>

		<main class="main">
			<div class="eyebrow">// NEW TASK</div>
			<h1>タスクの追加</h1>

			<div class="cy-card" style="max-width: 640px; margin-top: 24px;">
				<div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

				<form th:action="@{/task/add}" method="post" th:object="${task}">
					<input type="hidden" name="_csrf" th:value="${csrfToken}">
					<div class="form-group">
						<label for="title">タスク名</label>
						<input type="text" class="form-control" id="title" th:field="*{title}" maxlength="100"
							placeholder="例：資料作成">
					</div>
					<div class="form-group">
						<label for="description">詳細</label>
						<textarea class="form-control" id="description" th:field="*{description}" maxlength="500"
							rows="4" placeholder="タスクの詳細を入力"></textarea>
					</div>
					<div class="form-group">
						<label for="dueDate">期限</label>
						<input type="date" class="form-control" id="dueDate" th:field="*{dueDate}">
					</div>
					<button type="submit" class="btn btn-primary">登録</button>
					<a th:href="@{/index}" class="btn btn-secondary">キャンセル</a>
				</form>
			</div>
		</main>
	</div>

	<script th:src="@{/js/jquery-4.0.0.slim.min.js}"></script>
	<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>

</html>
