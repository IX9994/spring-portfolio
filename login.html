<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('ログイン')}"></head>

<body>
	<div class="auth">
		<div class="auth-box">
			<a class="auth-brand" th:href="@{/top}">TASKS//SYS</a>

			<div class="cy-card">
				<div class="eyebrow">// SIGN IN</div>
				<h1 style="margin-bottom: 20px;">ログイン</h1>

				<div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>
				<div class="alert alert-success" th:if="${param.registered}">
					登録が完了しました。ログインしてください。
				</div>

				<form th:action="@{/login}" method="post">
					<input type="hidden" name="_csrf" th:value="${csrfToken}">
					<div class="form-group">
						<label for="InputEmail">メールアドレス</label>
						<input type="email" class="form-control" id="InputEmail" name="mailAdress"
							placeholder="email address">
					</div>
					<div class="form-group">
						<label for="InputPassword">パスワード</label>
						<input type="password" class="form-control" id="InputPassword" name="password"
							placeholder="Password">
					</div>
					<button type="submit" class="btn btn-primary btn-block">ログイン</button>
				</form>

				<p class="mt-3 mb-0 text-center">
					<a th:href="@{/register}">新規登録はこちら</a>
				</p>
			</div>
		</div>
	</div>

	<script th:src="@{/js/jquery-4.0.0.slim.min.js}"></script>
	<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>

</html>
