<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('タスク詳細')}"></head>

<body>
	<div class="app">
		<nav th:replace="~{fragments :: sidebar('list')}"></nav>

		<main class="main">
			<div class="eyebrow">// TASK DETAIL</div>
			<h1>タスク詳細</h1>

			<div class="cy-card" style="max-width: 720px; margin-top: 24px;" th:if="${task != null}">
				<table class="cy-table detail">
					<tr>
						<th>ID</th>
						<td class="mono" th:text="${task.id}"></td>
					</tr>
					<tr>
						<th>タスク名</th>
						<td th:text="${task.title}"></td>
					</tr>
					<tr>
						<th>詳細</th>
						<td th:text="${task.description}"></td>
					</tr>
					<tr>
						<th>状態</th>
						<td>
							<span class="tag"
								th:classappend="${task.isDone()} ? 'tag-done' : (${task.overdue} ? 'tag-over' : 'tag-todo')"
								th:text="${task.overdue} ? '期限切れ' : ${task.completedLabel}"></span>
						</td>
					</tr>
					<tr>
						<th>追加日</th>
						<td class="mono" th:text="${#temporals.format(task.createdDate, 'yyyy/MM/dd')}"></td>
					</tr>
					<tr>
						<th>期限</th>
						<td
							th:text="${task.dueDate != null} ? ${#temporals.format(task.dueDate, 'yyyy/MM/dd')} : '未設定'">
						</td>
					</tr>
				</table>
			</div>

			<div class="cy-card" style="max-width: 720px; margin-top: 24px;" th:if="${task == null}">
				該当するIDのタスクが見つかりませんでした。
			</div>

			<div style="margin-top: 20px;">
				<a th:if="${task != null}" th:href="@{/task/{id}/edit(id=${task.id})}" class="btn btn-secondary">編集</a>
				<form th:if="${task != null}" th:action="@{/task/{id}/delete(id=${task.id})}" method="post"
					class="d-inline" onsubmit="return confirm('このタスクを削除しますか？');">
					<input type="hidden" name="_csrf" th:value="${csrfToken}">
					<button type="submit" class="btn btn-danger">削除</button>
				</form>
				<a th:href="@{/index}" class="btn btn-primary">一覧に戻る</a>
			</div>
		</main>
	</div>

	<script th:src="@{/js/jquery-4.0.0.slim.min.js}"></script>
	<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>

</html>
