<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('ログアウト')}"></head>

<body>
	<div class="app">
		<nav th:replace="~{fragments :: sidebar('logout')}"></nav>

		<main class="main">
			<div class="eyebrow">// SIGN OUT</div>
			<h1>ログアウト確認</h1>

			<div class="cy-card" style="max-width: 480px; margin-top: 24px;">
				<p>ログアウトしますか？</p>
				<form th:action="@{/doLogout}" method="post">
					<input type="hidden" name="_csrf" th:value="${csrfToken}">
					<button type="submit" class="btn btn-primary">はい</button>
				</form>
				<a th:href="@{/index}" class="btn btn-secondary">いいえ</a>
			</div>
		</main>
	</div>

	<script th:src="@{/js/jquery-4.0.0.slim.min.js}"></script>
	<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>

</html>
